<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanta Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1f3d;--mut:#5b6b86;--line:#dfe6f0;--navy:#0b1f3a;--green:#16a34a;--gsoft:#e3f5ea;--c1:#1e3a8a;--warn:#fff4d6;--wink:#6b4e00;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#111f36;--ink:#e8eef9;--mut:#93a4c0;--line:#223454;--gsoft:#12331f;--c1:#7aa2f7;--warn:#3a2f10;--wink:#f3d98a;--bad:#ff8a80}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}aside{width:220px;background:var(--navy);color:#dbe5f5;padding:18px 12px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside h1{font-size:18px;margin:0 8px 14px;color:#fff;letter-spacing:.2px}aside h1 span{color:#4ade80}
aside a{color:#c3d1ea;text-decoration:none;padding:9px 10px;border-radius:8px;border-left:3px solid transparent}aside a.on{background:#14305a;color:#fff;border-left-color:#4ade80}aside a:hover{background:#102a4e}
aside small{margin:auto 8px 0;color:#8fa5c9;font-size:11.5px}
main{flex:1;min-width:0;padding:20px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.top h2{margin:0;font-size:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.seg button{border:0;background:none;color:var(--ink);padding:6px 14px;cursor:pointer;font:inherit}.seg button.on{background:var(--navy);color:#fff}
.banner{background:var(--warn);color:var(--wink);border:1px solid #e6c766;border-radius:8px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:8px;padding:10px 12px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.bar input,.bar select,.fld select,.fld input{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;cursor:pointer;font:inherit}.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}tbody tr:hover{background:var(--gsoft)}tr.cl{cursor:pointer}
.low{color:var(--mut);font-style:italic}.muted{color:var(--mut)}.tag{font-size:11px;background:var(--gsoft);color:var(--green);border-radius:4px;padding:1px 6px;margin-left:4px}.tag.w{background:var(--warn);color:var(--wink)}
.pos{color:var(--green);font-weight:600}.neg{color:var(--bad);font-weight:600}
svg text{fill:var(--mut);font-size:11px}.gl{stroke:var(--line)}.l1{stroke:var(--c1);fill:none;stroke-width:2.2}.l2{stroke:var(--green);fill:none;stroke-width:2.2}.p1{fill:var(--c1)}.p2{fill:var(--green)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px;margin:10px 0}.fld label{display:block;font-size:12px;color:var(--mut)}.fld select,.fld input{width:100%}
.drawer{position:fixed;inset:0;background:rgba(5,12,25,.5);display:flex;justify-content:flex-end;z-index:20}.drawer>div{background:var(--bg);width:min(760px,100%);overflow:auto;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.rep{background:var(--gsoft);border-radius:8px;padding:8px 12px;margin-top:8px}.rep.e{background:var(--warn);color:var(--wink)}
@media(max-width:760px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}aside h1{margin:0 8px 0 0}aside small{display:none}main{padding:14px}}
</style></head><body>
<div class="app"><aside><h1>Fanta <span>Analytics</span></h1>
<a href="#dashboard" data-v="dashboard">Dashboard</a><a href="#rosa" data-v="rosa">Rosa</a><a href="#giocatori" data-v="giocatori">Giocatori</a><a href="#importazione" data-v="importazione">Importazione</a><a href="#legenda" data-v="legenda">Legenda</a>
<small>I dati sono quelli caricati da te o dall’amministratore. Nessun collegamento a Fantacalcio.it e nessun aggiornamento automatico dei voti.</small></aside>
<main><div class="top"><h2 id="ttl"></h2><div class="seg" id="fmt"><button data-f="classic">Classic</button><button data-f="mantra">Mantra</button></div></div><div id="ban"></div><div id="view"></div></main></div>
<div id="dr"></div>
<script>
const KEY="fantaAnalyticsV1",$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const fmt=(n,d=2)=>n==null?"—":n.toFixed(d).replace(".",",");
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sumN=(rows,keys)=>{let t=0,f=false;rows.forEach(r=>keys.forEach(k=>{if(r[k]!=null){t+=r[k];f=true}}));return f?t:null};
const MAN=["Por","Dd","Ds","Dc","E","M","C","W","T","A","Pc"],M2C={por:"P",dd:"D",ds:"D",dc:"D",e:"C",m:"C",c:"C",w:"C",t:"C",a:"A",pc:"A"};
const CW={portiere:"P",difensore:"D",centrocampista:"C",attaccante:"A"};
let S,UI={q:"",role:"",sk:"fm",sd:-1,sel:null},imp={rosa:null,voti:null,anag:null,cal:null},impMode={rosa:"add",voti:"add",anag:"add",cal:"add"};

function demo(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
 const P=[["Demo Alfa","Squadra 1","P",["Por"]],["Demo Beta","Squadra 2","D",["Dd","E"]],["Demo Gamma","Squadra 3","D",["Dc"]],["Demo Delta","Squadra 1","D",["Ds"]],["Demo Epsilon","Squadra 4","C",["M","C"]],["Demo Zeta","Squadra 2","C",["T"]],["Demo Eta","Squadra 5","C",["W","A"]],["Demo Theta","Squadra 3","A",["Pc"]],["Demo Iota","Squadra 4","A",["A","Pc"]]];
 const roster=[],votes=[];
 P.forEach(([nome,squadra,ruolo,mantra],i)=>{const k=norm(nome);roster.push({k,nome,squadra,ruolo,mantra,costo:null});
  for(let g=1;g<=8;g++){const v={k,nome,g,voto:null,fanta:null,gol:null,ass:null,amm:null,esp:null,aut:null,rs:null,gs:null,rp:null};
   if(r()>.13){v.voto=Math.round((5+r()*3)*2)/2;v.gol=r()<(ruolo=="A"?.35:ruolo=="C"?.12:.04)?1:0;v.ass=r()<.12?1:0;v.amm=r()<.15?1:0;v.esp=0;v.aut=0;v.rs=0;
    if(ruolo=="P"){v.gs=Math.floor(r()*3);v.rp=0}v.fanta=v.voto+3*v.gol+v.ass-.5*v.amm-(v.gs||0)}
   votes.push(v)}});
 return{fmt:"classic",demo:true,hasVoto:true,roster,votes}}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const DR={gol:3,ass:1,rp:3,rs:-3,aut:-2,amm:-.5,esp:-1,gs:-1};if(!S||!S.roster)S=demo();if(!S.rules)S.rules={...DR};if(!S.fvMode)S.fvMode="auto";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(SH.db&&!SH.owner&&!S.demo?{...S,votes:[]}:S))}catch(e){}};

/* ---------- CALCOLI ---------- */
function eff(r,p){if(S.fvMode!=="calc"&&r.fanta!=null)return{...r,fc:false};if(r.voto==null)return{...r,fanta:S.fvMode==="calc"?null:r.fanta,fc:false};
 const gk=p.ruolo==="P"||(p.mantra||[]).includes("Por");let t=r.voto;for(const[k,w]of Object.entries(S.rules)){if(k==="gs"&&!gk)continue;t+=w*(r[k]||0)}return{...r,fanta:t,fc:true}}
const isValid=v=>S.hasVoto?v.voto!=null:v.fanta!=null;
function compute(all){
 const by={};S.votes.filter(v=>all||inR(v.g)).forEach(v=>(by[v.k]=by[v.k]||[]).push(v));
 let base=S.roster.slice(),derived=false;
 if(!base.length&&S.votes.length&&!CEN()){derived=true;const seen={};S.votes.forEach(v=>{if(!seen[v.k]){seen[v.k]=1;base.push({k:v.k,nome:v.nome,squadra:"",ruolo:v.ruolo||"",mantra:v.mantra||[]})}})}
 base=base.map(p=>{if(p.ruolo&&(p.mantra||[]).length)return p;const a=anOf(p);if(!a)return p;return{...p,ruolo:p.ruolo||a.ruolo,mantra:(p.mantra||[]).length?p.mantra:a.mantra,squadra:p.squadra||a.squadra}});
 const G=[...new Set(base.flatMap(p=>(by[p.k]||[]).map(v=>v.g)))].sort((a,b)=>a-b);
 const P=base.map(p=>{const rows=(by[p.k]||[]).map(r=>eff(r,p)).sort((a,b)=>a.g-b.g),val=rows.filter(isValid);
  const vv=val.filter(r=>r.voto!=null).map(r=>r.voto),ff=val.filter(r=>r.fanta!=null).map(r=>r.fanta);
  const useF=ff.length>0,metric=r=>useF?r.fanta:r.voto,l5r=val.filter(r=>metric(r)!=null).slice(-5),l5=avg(l5r.map(metric)),ref=useF?avg(ff):avg(vv);
  return{...p,rows,val,pres:val.length,pct:G.length&&rows.length?val.length/G.length*100:null,mv:avg(vv),fm:avg(ff),l5,l5n:l5r.length,d:l5!=null&&ref!=null?l5-ref:null,
   gol:sumN(rows,["gol"]),ass:sumN(rows,["ass"]),mal:sumN(rows,["amm","esp","aut","rs"]),gs:sumN(rows,["gs"]),rp:sumN(rows,["rp"]),low:val.length<3}});
 return{P,G,derived}}
const flt=P=>P.filter(p=>{if(UI.q&&!norm(p.nome).includes(norm(UI.q)))return false;
 if(UI.role)return S.fmt==="classic"?p.ruolo===UI.role:(p.mantra||[]).includes(UI.role);return true});

/* ---------- GRAFICI ---------- */
function lineChart(xs,series){const W=640,H=240,L=34,R=12,T=12,B=26,all=series.flatMap(s=>s.y).filter(v=>v!=null);
 if(xs.length<2||all.length<2)return`<p class="muted">Dati insufficienti per il grafico: servono almeno due valori validi su giornate diverse.</p>`;
 const lo=Math.floor(Math.min(...all)-.5),hi=Math.ceil(Math.max(...all)+.5),st=Math.max(1,Math.ceil((hi-lo)/5));
 const X=i=>L+i*(W-L-R)/(xs.length-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(let t=lo;t<=hi;t+=st)o+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-5}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
 const se=Math.ceil(xs.length/14);xs.forEach((x,i)=>{if(i%se==0)o+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${x}</text>`});
 series.forEach((s,j)=>{let d="",pen=false;s.y.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1);pen=true});
  o+=`<path class="l${j+1}" d="${d}"/>`;s.y.forEach((v,i)=>{if(v!=null)o+=`<circle class="p${j+1}" cx="${X(i)}" cy="${Y(v)}" r="3.2"><title>${s.name}, giornata ${xs[i]}: ${fmt(v)}${s.n?" (su "+s.n[i]+" valutazioni)":""}</title></circle>`})});
 return o+`</svg><div class="muted">${series.map((s,j)=>`<span class="${j?"pos":""}" style="${j?"":"color:var(--c1);font-weight:600"}">● ${s.name}</span>`).join(" &nbsp; ")} &nbsp; Le giornate senza dati restano vuote, non sono zeri.</div>`}
function formChart(P){const L=P.filter(p=>p.l5!=null).sort((a,b)=>b.l5-a.l5).slice(0,10);
 if(!L.length)return`<p class="muted">Dati insufficienti: nessun giocatore ha prestazioni valide.</p>`;
 const mx=Math.max(10,...L.map(p=>p.l5),...L.map(p=>p.fm??p.mv??0)),W=480,LB=140,rh=40,bw=W-LB-44,w=v=>Math.max(0,v)/mx*bw;let o=`<svg viewBox="0 0 ${W} ${L.length*rh+4}" width="100%">`;
 L.forEach((p,i)=>{const ref=p.fm??p.mv,y=i*rh+4,nm=p.nome.length>19?p.nome.slice(0,18)+"…":p.nome;
  o+=`<text x="0" y="${y+13}" style="fill:var(--ink);font-size:13px;font-weight:600"><title>${esc(p.nome)}</title>${esc(nm)}</text><rect x="${LB}" y="${y+2}" width="${w(p.l5)}" height="13" rx="3" style="fill:var(--green)"/><text x="${LB+w(p.l5)+5}" y="${y+13}" style="fill:var(--ink);font-size:12px;font-weight:600">${fmt(p.l5)}</text>`;
  if(ref!=null)o+=`<rect x="${LB}" y="${y+18}" width="${w(ref)}" height="10" rx="3" style="fill:var(--c1)"/><text x="${LB+w(ref)+5}" y="${y+27}" style="fill:var(--mut);font-size:12px">${fmt(ref)}</text>`});
 return o+`</svg><div style="font-size:13px;margin-top:6px"><span class="pos">■ Ultime 5 prestazioni valide</span> &nbsp; <span style="color:var(--c1);font-weight:600">■ Media stagionale</span><br><span class="muted">Media stagionale = fantamedia, o media voto se mancano i fantavoti. Primi 10 giocatori per forma recente.</span></div>`}
function formChartOld(P){const L=P.filter(p=>p.l5!=null).sort((a,b)=>b.l5-a.l5).slice(0,10);
 if(!L.length)return`<p class="muted">Dati insufficienti: nessun giocatore ha prestazioni valide.</p>`;
 const mx=Math.max(10,...L.map(p=>p.l5),...L.map(p=>p.mv??0)),W=640,rh=26;let o=`<svg viewBox="0 0 ${W} ${L.length*rh+8}" width="100%">`;
 L.forEach((p,i)=>{const ref=p.fm??p.mv,y=i*rh+4,w=v=>Math.max(0,v)/mx*(W-210);
  o+=`<text x="0" y="${y+12}">${esc(p.nome.slice(0,22))}</text><rect x="150" y="${y}" width="${w(p.l5)}" height="9" rx="2" style="fill:var(--green)"/><text x="${156+w(p.l5)}" y="${y+9}">${fmt(p.l5)}</text>`;
  if(ref!=null)o+=`<rect x="150" y="${y+11}" width="${w(ref)}" height="7" rx="2" style="fill:var(--c1)"/><text x="${156+w(ref)}" y="${y+18}">${fmt(ref)}</text>`});
 return o+`</svg><div class="muted"><span class="pos">■ Ultime 5 valide</span> &nbsp; <span style="color:var(--c1);font-weight:600">■ Media stagionale</span> (fantamedia, o media voto se mancano i fantavoti)</div>`}

/* ---------- TABELLE E FILTRI ---------- */
function filterBar(P){const roles=S.fmt==="classic"?["P","D","C","A"]:MAN.filter(r=>P.some(p=>(p.mantra||[]).includes(r)));
 return`<div class="bar"><input id="q" list="pl" autocomplete="off" placeholder="Cerca o scegli un giocatore" value="${esc(UI.q)}"><datalist id="pl">${P.filter(p=>(!UI.role||(S.fmt==="classic"?p.ruolo===UI.role:(p.mantra||[]).includes(UI.role)))&&(!(UI.g1||UI.g2)||p.rows.length)).sort((a,b)=>a.nome.localeCompare(b.nome,"it")).map(p=>`<option value="${esc(p.nome)}">`).join("")}</datalist><button class="chip ${UI.role?"":"on"}" onclick="setRole('')">Tutti</button>${roles.map(r=>`<button class="chip ${UI.role==r?"on":""}" onclick="setRole('${r}')">${r}</button>`).join("")}${gSel()}${UI.q||UI.role||UI.g1||UI.g2?`<button class="chip" onclick="resetF()">Elimina filtri</button>`:""}</div>`+
 (S.fmt==="mantra"&&!roles.length?`<p class="muted">Nessun dato Mantra disponibile: nell’importazione della rosa associa la colonna dei ruoli Mantra.</p>`:"")}
function table(P,full){const C=[["nome","Giocatore"],["ruolo","Ruolo"],["pres","Pres."],["pct","% con voto"],["mv","Media voto"],["fm","Fantamedia"],["l5","Ult. 5"],["d","Δ forma"],["gol","Gol"],["ass","Assist"],["mal","Malus"]].concat(full?[["gs","Gol sub."],["rp","Rig. par."]]:[]);
 const R=p=>S.fmt==="classic"?(p.ruolo||"—"):((p.mantra||[]).join("/")||"—"),key=UI.sk;
 const L=P.slice().sort((a,b)=>{let x=key=="ruolo"?R(a):a[key],y=key=="ruolo"?R(b):b[key];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(typeof x=="string"?x.localeCompare(y):x-y)*(key=="nome"||key=="ruolo"?-UI.sd:UI.sd)});
 if(!L.length)return`<p class="muted">Nessun giocatore corrisponde ai filtri.</p>`;
 const n=(p,k,d=2)=>p[k]==null?"—":fmt(p[k],d),lw=p=>p.low?"low":"";
 return`<div class="tw"><table><thead><tr>${C.map(c=>`<th onclick="sortBy('${c[0]}')">${c[1]}${key==c[0]?(UI.sd<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>${L.map(p=>`<tr class="cl" data-k="${esc(p.k)}" onclick="openP(this.dataset.k)"><td>${esc(p.nome)}${p.low?`<span class="tag w" title="Meno di 3 valutazioni valide: medie poco affidabili">dati insufficienti</span>`:""}<div class="muted" style="font-size:11px">${esc(p.squadra)}</div></td><td>${R(p)}</td><td>${p.pres}</td><td>${p.pct==null?"—":fmt(p.pct,0)+"%"}</td><td class="${lw(p)}">${n(p,"mv")}</td><td class="${lw(p)}">${n(p,"fm")}</td><td>${n(p,"l5")}${p.l5n&&p.l5n<5?` <span class="muted" title="Solo ${p.l5n} prestazioni valide">(${p.l5n})</span>`:""}</td><td class="${p.d>0?"pos":p.d<0?"neg":""}">${p.d==null?"—":(p.d>0?"+":"")+fmt(p.d)}</td><td>${n(p,"gol",0)}</td><td>${n(p,"ass",0)}</td><td>${n(p,"mal",0)}</td>${full?`<td>${n(p,"gs",0)}</td><td>${n(p,"rp",0)}</td>`:""}</tr>`).join("")}</tbody></table></div>`}
let KEEP=null;UI.met="fanta";const COL=["#2563eb","#16a34a","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#475569","#ea580c"],setMet=m=>{UI.met=m;render()};
function multiChart(xs,SR){const W=640,H=260,L=34,R=12,T=12,B=26,all=SR.flatMap(s=>s.y).filter(v=>v!=null);
 if(xs.length<2||all.length<2)return`<p class="muted">Dati insufficienti per il grafico: servono almeno due valori validi su giornate diverse.</p>`;
 const lo=Math.floor(Math.min(...all)-.5),hi=Math.ceil(Math.max(...all)+.5),st=Math.max(1,Math.ceil((hi-lo)/5)),X=i=>L+i*(W-L-R)/(xs.length-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);let o=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
 for(let t=lo;t<=hi;t+=st)o+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-5}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
 const se=Math.ceil(xs.length/14);xs.forEach((x,i)=>{if(i%se==0)o+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${x}</text>`});

 const x=m[0],h=teamEq(p.squadra,x.casa);return{t:(h?x.osp:x.casa)+(h?" (C)":" (T)"),tip:"Giornata "+c.ng+": "+x.casa+" - "+x.osp}}
function admMsg(m){SH.msg=m;const e=$("#adm");if(e)e.textContent=m}
function adminCard(){if(SH.db&&SH.db.static)return adminStatic();const gs=Object.values(SH.docs||{}).map(d=>d.g).sort((a,b)=>a-b);
 return`<div class="card"><h3>Amministrazione: voti centrali (solo proprietario)</h3><p>Importa qui sopra i file delle giornate, poi premi Pubblica: tutti gli utenti vedranno gli stessi voti e potranno caricare solo la propria rosa. Le regole del fantavoto impostate in questa pagina sono pubblicate insieme ai voti. Una giornata già pubblicata con lo stesso numero viene sostituita.</p><p><b>Giornate pubblicate:</b> ${gs.length?gs.join(", "):"nessuna"}${SH.meta&&SH.meta.updatedAt?` · ultimo aggiornamento ${esc(SH.meta.updatedAt.slice(0,16).replace("T"," "))}`:""}<br><b>Nel tuo spazio di lavoro:</b> ${new Set(S.votes.map(v=>v.g)).size} giornate, ${S.votes.length} righe, listone: ${(S.anag||[]).length} giocatori, calendario: ${(S.cal||[]).length} partite</p><div class="bar"><button class="btn" onclick="publishAll()">Pubblica per tutti</button><button class="btn sec" onclick="pullAll()">Carica i voti pubblicati nel mio spazio</button><select id="dg">${gs.map(g=>`<option>${g}</option>`).join("")}</select><button class="btn red" onclick="delG()">Elimina giornata pubblicata</button></div><div id="adm" class="muted">${esc(SH.msg)}</div></div>`}
async function publishAll(){if(S.demo)return admMsg("Elimina prima i dati dimostrativi.");if(!S.votes.length&&!(S.anag||[]).length&&!(S.cal||[]).length)return admMsg("Niente da pubblicare: importa prima i voti, il listone o il calendario.");
 const by={};S.votes.forEach(v=>(by[v.g]=by[v.g]||[]).push(v));const n=Object.keys(by).length;if(!confirm("Pubblicare "+n+" giornate per tutti gli utenti? Le giornate già presenti con lo stesso numero saranno sostituite."))return;
 try{for(const g of Object.keys(by))await SH.db.doc("giornate/g"+g).set({g:+g,rows:by[g].map(v=>[v.nome,v.voto,v.fanta,v.gol,v.ass,v.amm,v.esp,v.aut,v.rs,v.gs,v.rp])});
  await SH.db.doc("lega/regole").set({rules:S.rules,fvMode:S.fvMode,hasVoto:S.hasVoto,updatedAt:new Date().toISOString()});if(S.cal&&S.cal.length)await SH.db.doc("lega/calendario").set({rows:S.cal.map(x=>[x.g,x.casa,x.osp])});if(S.anag&&S.anag.length)await SH.db.doc("lega/anagrafica").set({rows:S.anag.map(enc)});admMsg("Pubblicate "+n+" giornate"+(S.anag&&S.anag.length?" e il listone ("+S.anag.length+" giocatori)":"")+".")}catch(e){admMsg("Errore di pubblicazione: "+(e.code||e.message))}}
function pullAll(){if(!SH.votes||!SH.votes.length)return admMsg("Non ci sono voti pubblicati.");if(!confirm("Sostituire i voti del tuo spazio di lavoro con quelli pubblicati?"))return;S.demo=false;S.votes=SH.votes.slice();if(SH.anag&&SH.anag.length)S.anag=SH.anag.slice();if(SH.cal&&SH.cal.length)S.cal=SH.cal.slice();if(SH.meta&&SH.meta.rules){S.rules={...DR,...SH.meta.rules};S.fvMode=SH.meta.fvMode||"auto"}S.hasVoto=!SH.meta||SH.meta.hasVoto!==false;save();render()}
async function delG(){const g=$("#dg")&&$("#dg").value;if(!g)return admMsg("Nessuna giornata da eliminare.");if(!confirm("Eliminare la giornata "+g+" per tutti gli utenti?"))return;try{await SH.db.doc("giornate/g"+g).delete();admMsg("Giornata "+g+" eliminata.")}catch(e){admMsg("Errore: "+(e.code||e.message))}}
const ADM=()=>/[?&]admin\b/.test(location.search);
async function initStatic(){try{const r=await fetch("voti.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const J=await r.json();if(!J||!Array.isArray(J.giornate))throw 0;
 SH.owner=ADM();SH.db={static:true};SH.docs={};J.giornate.forEach(d=>SH.docs["g"+d.g]=d);SH.anag=(J.anagrafica||[]).map(dec);SH.cal=(J.calendario||[]).map(decC);SH.meta=J.regole?{...J.regole,updatedAt:J.aggiornato||J.regole.updatedAt}:null;applyShared()}
 catch(e){if(ADM()){SH.owner=true;SH.db={static:true};SH.docs={};SH.loaded=true;render()}}}
function adminStatic(){const n=new Set(S.votes.map(v=>v.g)).size,pub=[...new Set((SH.votes||[]).map(v=>v.g))].sort((a,b)=>a-b);
 return`<div class="card"><h3>Amministrazione: voti.json (modalit\u00e0 ?admin)</h3><p>Importa qui sopra i file delle giornate e, se vuoi, il listone Serie A e il calendario, poi scarica <b>voti.json</b> e sostituisci il file sul tuo hosting, accanto a index.html. Gli utenti vedranno i nuovi dati al prossimo caricamento della pagina. Il file contiene <b>tutto</b> ci\u00f2 che c\u2019\u00e8 nel tuo spazio di lavoro (giornate, listone, calendario) e le regole del fantavoto impostate qui: se parti da zero, carica prima il voti.json gi\u00e0 pubblicato.</p><p><b>Giornate nel voti.json pubblicato:</b> ${pub.length?pub.join(", "):"nessuna"}<br><b>Listone pubblicato:</b> ${(SH.anag||[]).length} giocatori \u00b7 <b>Calendario pubblicato:</b> ${(SH.cal||[]).length} partite<br><b>Nel tuo spazio di lavoro:</b> ${n} giornate, ${S.votes.length} righe, listone: ${(S.anag||[]).length} giocatori, calendario: ${(S.cal||[]).length} partite</p><div class="bar"><button class="btn" onclick="exportJson()">Scarica voti.json</button><button class="btn sec" onclick="pullAll()">Carica il voti.json pubblicato nel mio spazio</button></div><div id="adm" class="muted">${esc(SH.msg)}</div></div>`}
function exportJson(){if(S.demo)return admMsg("Elimina prima i dati dimostrativi.");if(!S.votes.length&&!(S.anag||[]).length&&!(S.cal||[]).length)return admMsg("Niente da esportare.");
 const by={};S.votes.forEach(v=>(by[v.g]=by[v.g]||[]).push(v));const now=new Date().toISOString();
 const J={versione:3,aggiornato:now,regole:{rules:S.rules,fvMode:S.fvMode,hasVoto:S.hasVoto,updatedAt:now},anagrafica:(S.anag||[]).map(enc),calendario:(S.cal||[]).map(x=>[x.g,x.casa,x.osp]),giornate:Object.keys(by).map(Number).sort((a,b)=>a-b).map(g=>({g,rows:by[g].map(v=>[v.nome,v.voto,v.fanta,v.gol,v.ass,v.amm,v.esp,v.aut,v.rs,v.gs,v.rp])}))};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(J)],{type:"application/json"}));a.download="voti.json";document.body.appendChild(a);a.click();a.remove();admMsg("voti.json scaricato ("+J.giornate.length+" giornate, "+J.anagrafica.length+" giocatori nel listone, "+J.calendario.length+" partite).")}
function legenda(){const sec=(t,rows)=>`<div class="card"><h3>${t}</h3><div class="tw"><table><tbody>${rows.map(r=>`<tr><td style="vertical-align:top;white-space:normal;font-weight:600;width:210px">${r[0]}</td><td style="text-align:left;white-space:normal">${r[1]}</td></tr>`).join("")}</tbody></table></div></div>`;
 return`<p class="muted">Come sono calcolati i valori mostrati nell’app. Tutti i calcoli usano solo i dati che hai importato. «—» significa dato non disponibile, mai zero.</p>`+
 sec("Dati di base",[
 ["Prestazione valida","Una giornata in cui il giocatore ha un voto. Se non hai associato la colonna Voto, conta la giornata con un fantavoto. Le giornate senza voto (SV) non sono valide e non sono mai trattate come zero."],
 ["Presenze","Numero di prestazioni valide del giocatore nelle giornate considerate."],
 ["% con voto","Presenze divise per le giornate presenti nei dati (nell’intervallo scelto dal filtro). Nei totali della Dashboard: presenze di tutti i giocatori divise per (giocatori con almeno una riga di dati × giornate considerate)."],
 ["Giornate considerate","Giornate diverse presenti nei dati dei giocatori in rosa, dentro l’intervallo di giornate eventualmente filtrato."],
 ["Dati insufficienti","Etichetta mostrata con meno di 3 prestazioni valide: le medie sono calcolate, ma poco affidabili (in corsivo)."]]) +
 sec("Medie",[
 ["Media voto","Media aritmetica dei voti delle prestazioni valide."],
 ["Fantamedia","Media aritmetica dei fantavoti delle prestazioni valide."],
 ["Fantavoto","Se il file lo contiene, è usato così com’è. Se manca (e c’è il voto) è calcolato: voto + somma di (valore della regola × numero di eventi) per gol, assist, rigori parati, rigori sbagliati, autogol, ammonizioni, espulsioni e, solo per i portieri, gol subiti. Le regole si modificano in Importazione. Nella scheda giocatore i valori calcolati hanno un asterisco. Senza voto il fantavoto calcolato resta vuoto. Non sono inclusi modificatori di squadra e bonus speciali di lega."],
 ["Ult. 5","Media delle ultime 5 prestazioni valide del giocatore, in ordine di giornata, saltando le giornate senza voto. Usa il fantavoto se il giocatore ne ha almeno uno, altrimenti il voto. Se le prestazioni sono meno di 5, il numero usato è indicato tra parentesi."],
 ["Δ forma","Ult. 5 meno la media stagionale (fantamedia, oppure media voto se mancano i fantavoti), sempre con la stessa metrica. Positivo (verde): rende sopra la sua media. Negativo (rosso): sotto. Le ultime 5 sono incluse nella media stagionale, quindi con 5 o meno prestazioni valide il delta è 0. Con filtri per giornata entrambe le medie sono calcolate nell’intervallo."]]) +
 sec("Bonus, malus e totali",[
 ["Gol, Assist","Somma dei valori presenti nelle giornate considerate. «GF» nella mappa di calore è la stessa somma dei gol."],
 ["Malus","Ammonizioni + espulsioni + autogol + rigori sbagliati. I gol subiti e i rigori parati sono mostrati a parte («Gol sub.», «Rig. par.»)."],
 ["GS","Gol subiti: mostrati solo per i portieri (P in Classic, Por in Mantra)."],
 ["Cartellini","Rosso = totale espulsioni; giallo = totale ammonizioni, nelle giornate considerate."],
 ["Totali con «—»","Se la colonna non è presente nel file importato, il totale è «—». Se è presente, anche uno zero è un dato reale."]]) +
 sec("Dashboard",[
 ["Media voto e fantamedia (KPI)","Media di tutte le valutazioni valide dei giocatori filtrati, messe insieme. Non è la media delle medie dei singoli giocatori. Il numero di valutazioni usate è indicato sotto il valore."],
 ["Andamento medie per giornata","Per ogni giornata, media delle valutazioni valide dei giocatori filtrati. Nel tooltip è indicato su quante valutazioni si basa. Le giornate senza dati restano vuote."],
 ["Ultime cinque prestazioni","Primi 10 giocatori per media delle ultime 5 prestazioni valide (barra verde), confrontata con la media stagionale (barra blu)."],
 ["Mappa di calore","Una riga per giocatore, una colonna per giornata, divisi per ruolo. Il colore è su scala fissa: neutro a 6, verde sopra, rosso sotto, con intensità massima a ±3,5 per il fantavoto e ±2,5 per il voto. «Media» è la media dei valori validi mostrati, «#» quanti sono. Il punto · è una giornata senza valore. Clicca sull’intestazione di una colonna (giocatore, giornata, Media, #, GF, GS, cartellini) per ordinare le righe; un secondo clic inverte l’ordine. All’apertura è ordinata per media decrescente."],
 ["Ordinamento tabelle","I valori mancanti finiscono sempre in fondo, qualunque sia l’ordine scelto."]]) +
 sec("Filtri",[
 ["Ruolo","In Classic: P, D, C, A. In Mantra: posizioni presenti nei dati. Nel passaggio da Mantra a Classic, Por → P; Dd, Ds, Dc → D; E, M, C, W, T → C; A, Pc → A."],
 ["Giornate da / a","Limita ogni calcolo della Dashboard e dei Giocatori alle giornate scelte. La scheda del singolo giocatore e la vista Rosa usano sempre tutte le giornate."],
 ["Ultime 5 giornate","Imposta «da» alla quinta giornata più recente presente nei dati. È diverso da «Ult. 5», che prende le ultime 5 prestazioni valide di ciascun giocatore anche se non sono le ultime 5 giornate del campionato."],
 ["Cerca giocatore","Il menu propone solo i giocatori che rispettano ruolo e giornate, in ordine alfabetico."]]) +
 sec("Importazione e qualità dei dati",[
 ["Duplicati","Un voto è identificato da giocatore + giornata. Se la stessa riga compare più volte (anche in file o fogli diversi) è unita e non contata due volte. Se i valori differiscono si tiene il primo e il conflitto è segnalato nel resoconto."],
 ["Nome del giocatore","Confrontato senza accenti, maiuscole e punteggiatura. Due giocatori con lo stesso nome non sono distinguibili."],
 ["Valori non validi","Voti fuori da 0–10 e fantavoti fuori da −15/+30 sono ignorati e segnalati. I testi come SV o «-» diventano dato mancante."],
 ["Prossima (mappa di calore)","Avversario della giornata successiva all’ultima giornata con voti nei dati, ricavato dal calendario Serie A caricato, con C = in casa e T = in trasferta. Serve la squadra del giocatore (dalla rosa o dal listone): il confronto dei nomi ignora accenti, maiuscole e sigle come FC o AC. Se manca il calendario, la squadra non è nota o non si trova nel calendario, compare «—» e il motivo è nel suggerimento al passaggio del mouse. Non dipende dal filtro per giornata."],
 ["Ruoli mancanti (listone Serie A)","Se la rosa importata non ha il ruolo, l’app lo cerca nel listone Serie A confrontando il nome (senza accenti, maiuscole e ordine delle parole; ammessa l’iniziale del nome, ad esempio «Martinez L.»). Se più giocatori corrispondono e la squadra non basta a distinguerli, il giocatore resta senza ruolo e compare nel gruppo «Senza ruolo». Un ruolo già presente nella rosa non viene mai sostituito."],
 ["Rosa ricavata dai voti","Se non hai importato la rosa, i giocatori sono ricavati dal file dei voti e sono indicati come tali."],
 ["Origine dei dati","Rosa: il file che carichi tu, salvato nel tuo browser. Voti: quelli pubblicati centralmente dall’amministratore (in modalità locale, i file che carichi tu). Nessun collegamento a Fantacalcio.it e nessun aggiornamento automatico."]])}
const TT={dashboard:"Dashboard",rosa:"Rosa",giocatori:"Giocatori",importazione:"Importazione",legenda:"Legenda"};
function ban(){$("#ban").innerHTML=S.demo?`<div class="banner"><span><b>Dati dimostrativi.</b> Giocatori e voti sono fittizi e servono solo a mostrare il funzionamento.</span><button class="btn" onclick="S.roster=[];S.votes=[];S.demo=false;S.hasVoto=false;save();render()">Elimina dati dimostrativi</button><a href="#importazione">Importa la tua rosa</a></div>`:""}
function render(){if(CEN()&&SH.votes&&!S.demo)S.votes=SH.votes;const v=(location.hash||"#dashboard").slice(1),V=TT[v]?v:"dashboard";
 document.querySelectorAll("aside a").forEach(a=>a.classList.toggle("on",a.dataset.v==V));document.querySelectorAll("#fmt button").forEach(b=>b.classList.toggle("on",b.dataset.f==S.fmt));
 $("#ttl").textContent=TT[V];ban();if(V=="importazione")renderImp();else{$("#view").innerHTML={dashboard,rosa,giocatori,legenda}[V]();if(KEEP&&$("#q"))$("#q").replaceWith(KEEP);const q=$("#q");if(q)q.oninput=e=>{UI.q=e.target.value;const o=e.target,p=o.selectionStart;KEEP=o;render();KEEP=null;o.focus();try{o.setSelectionRange(p,p)}catch(x){}}}
 drawer()}
document.querySelectorAll("#fmt button").forEach(b=>b.onclick=()=>{S.fmt=b.dataset.f;UI.role="";save();render()});
window.addEventListener("hashchange",()=>{UI.sel=null;render()});render();initShared();
